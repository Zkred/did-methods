name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: the official did:webplus conformance vectors are cloned at test
    # time, so upstream vector changes must surface without a local commit.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Fetch official did:webplus conformance test vectors
        run: git clone --depth 1 https://github.com/LedgerDomain/did-webplus-spec.git /tmp/did-webplus-spec
      - run: pnpm test
        env:
          SPEC_VECTOR_DIR: /tmp/did-webplus-spec/test-vector